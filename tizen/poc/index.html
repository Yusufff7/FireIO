<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>FireIO Test</title>
  <style>
    /* Transparent: AVPlay draws the video on a plane beneath the web page,
       so anything opaque here hides it. */
    html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
    #av-player { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #panel {
      position: absolute; left: 40px; top: 40px; width: 900px; max-height: 1000px; overflow: hidden;
      padding: 20px 24px; background: rgba(10, 10, 11, 0.78); border-radius: 12px;
      color: #e8e8ea; font: 20px/1.45 sans-serif; white-space: pre-wrap;
    }
    #status { position: absolute; right: 40px; bottom: 40px; padding: 12px 18px; background: rgba(10, 10, 11, 0.78);
      border-radius: 10px; color: #a8e0ff; font: bold 28px sans-serif; }
  </style>
</head>
<body>
  <object id="av-player" type="application/avplayer"></object>
  <div id="panel"></div>
  <div id="status"></div>
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="config.local.js"></script>
  <script src="main.js"></script>
</body>
</html>
